<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ data.subject }}</title>
  </head>
  <body style="margin:0; padding:0; background:#f8fafc; color:#0f172a; font-family:Segoe UI, Arial, sans-serif;">
    <div style="max-width:640px; margin:0 auto; padding:32px 16px;">
      <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:20px; overflow:hidden; box-shadow:0 10px 40px rgba(15, 23, 42, 0.08);">
        <div style="padding:28px 32px; background:linear-gradient(135deg, {{ theme.primary_color }}, {{ theme.accent_color }}); color:#ffffff;">
          <p style="margin:0; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; opacity:0.85;">
            {{ app.name }}
          </p>
          <h1 style="margin:14px 0 0; font-size:28px; line-height:1.2;">
            {{ data.headline }}
          </h1>
        </div>
        <div style="padding:32px;">
          {% block content %}{% endblock %}
        </div>
      </div>
    </div>
  </body>
</html>
